{% extends "base.html" %}
{% block title %}إنشاء حساب مدير — مِشراك{% endblock %}
{% block content %}
<section class="auth-wrap auth-register"><div class="card auth-card admin-card"><span class="demo-tag">حساب بصلاحيات كاملة</span><h2>إنشاء حساب مدير</h2><p class="muted">أدخل بياناتك لإنشاء حساب مدير جديد.</p>
  <form class="stack" method="post"><label>اسم المدير الجديد<input name="username" minlength="3" maxlength="80" autocomplete="username" required></label><label>كلمة مرور المدير الجديد<input type="password" name="password" minlength="8" autocomplete="new-password" required><small class="muted">8 أحرف على الأقل</small></label><button class="btn gold" type="submit">إنشاء حساب المدير</button></form>
  <p class="auth-foot"><a href="{{ url_for('auth.login_admin') }}">العودة لدخول المدير</a> · <a href="{{ url_for('auth.login_user') }}">دخول المستخدم</a></p>
</div></section>
{% endblock %}
